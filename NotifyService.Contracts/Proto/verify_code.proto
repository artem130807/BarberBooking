syntax = "proto3";

option csharp_namespace = "NotifyServiceGrpc";

service VerifyCodeService {
  rpc RegisterUser(VerifyCodeRequest) returns (VerifyCodeResponse);
}

message VerifyCodeRequest {
  string code = 1;
  string email = 2;
}
message VerifyCodeResponse {
    string message = 1;
    bool IsSuccess = 2;
}